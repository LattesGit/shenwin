[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shenwin"
version = "1.0.0"
description = "Python OSINT tool for username enumeration across 500+ platforms"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "LaxenT", email = "[REDACTED]"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.8"

[project.scripts]
shenwin = "shenwin:main"

[project.urls]
Homepage = "https://github.com/LaxenTgit/shenwin"
Issues = "https://github.com/LaxenTgit/shenwin/issues"
